<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar contraseña · Cunco Delivery</title><style>body{margin:0;background:#f5f5f3;color:#24272b;font:16px system-ui,Arial}header{background:#24272b;color:#f5b335;padding:25px;text-align:center}main{max-width:430px;margin:36px auto;background:white;padding:26px;border-radius:18px;box-shadow:0 8px 28px #0001}input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:9px;font:inherit}input{border:1px solid #bbb}button{border:0;background:#f5b335;color:#24272b;font-weight:750;cursor:pointer}button:disabled{opacity:.5}a{color:#775000}#status{min-height:32px;white-space:pre-wrap} .hide{display:none}</style></head><body><header><h1>Cunco Delivery</h1><p>Recuperar acceso a gestión</p></header><main><div id="request"><h2>¿Olvidaste tu contraseña?</h2><p>Te enviaremos un enlace para crear una nueva.</p><form id="requestForm"><label>Correo de tu cuenta<input id="email" type="email" required value="mr.fritascunco@gmail.com" autocomplete="email"></label><button id="send" type="submit">Enviar correo de recuperación</button></form></div><div id="reset" class="hide"><h2>Crear contraseña nueva</h2><form id="resetForm"><input id="password" type="password" minlength="8" required placeholder="Nueva contraseña"><input id="repeat" type="password" minlength="8" required placeholder="Repetir contraseña"><button type="submit">Guardar contraseña</button></form></div><p id="status" role="status" aria-live="polite"></p><p><a href="gestion.html">← Volver a gestión</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>
const el=id=>document.getElementById(id),status=message=>el('status').textContent=message;
if(!window.supabase){status('No se pudo cargar la conexión. Comprueba internet y recarga.')}else{
const client=supabase.createClient('https://nbbwgrpsvhdrkokxirtw.supabase.co','sb_publishable_OrEYCaIT0bTr8BQOIvZ0Gw_m_6U_Sl0');
function showReset(){el('request').classList.add('hide');el('reset').classList.remove('hide');status('Escribe tu contraseña nueva.')}
client.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')showReset()});
if(location.hash.includes('type=recovery')){client.auth.getSession().then(({data})=>{if(data.session)showReset()})}
el('requestForm').onsubmit=async e=>{e.preventDefault();const btn=el('send');btn.disabled=true;status('Enviando solicitud...');try{const {error}=await client.auth.resetPasswordForEmail(el('email').value.trim(),{redirectTo:'https://cuncodelivery.github.io/recuperar.html'});status(error?'Error: '+error.message:'Solicitud enviada. Revisa tu correo y spam. Si el correo está registrado, recibirás un enlace.') }catch(err){status('Error de conexión: '+err.message)}finally{btn.disabled=false}};
el('resetForm').onsubmit=async e=>{e.preventDefault();if(el('password').value!==el('repeat').value)return status('Las contraseñas no coinciden.');status('Guardando...');const {error}=await client.auth.updateUser({password:el('password').value});if(error)return status('Error: '+error.message);el('reset').classList.add('hide');status('¡Contraseña cambiada! Ya puedes entrar a gestión.')};
}
</script></body></html>
